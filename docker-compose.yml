version: "3.8"
services:
  gaggimate-bridge:
    build: .
    image: ghcr.io/graphite-productions/gaggimate-bridge:latest
    container_name: gaggimate-bridge
    restart: unless-stopped
    ports:
      # Published on the host loopback only; reach it over the tailnet with `tailscale serve`.
      - "127.0.0.1:3000:3000"
    environment:
      # Inside the container the published port needs a non-loopback listener.
      # Safe because API_TOKEN is mandatory for that (the server refuses to start without it).
      HTTP_HOST: "0.0.0.0"
    env_file: .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup gaggimate-bridge
    restart: unless-stopped
